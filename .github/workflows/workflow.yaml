name: Build, push, and deploy to k8s

on:
  push:
    branches:
      - develop
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ดึงประวัติทั้งหมดเพื่อให้เข้าถึง tags ได้

      - name: Set IMAGE_TAG based on event
        id: set-image-vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # ถ้าเป็น tag event ใช้ tag เป็น image tag
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
          else
            # ถ้าเป็น push event ใช้ commit SHA (7 ตัวแรก)
            echo "IMAGE_TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=sit" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Self-Hosted Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.nspublic.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.nspublic.xyz/3cha/jobs:${{ steps.set-image-vars.outputs.IMAGE_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    # Pass variables to next job using job outputs
    outputs:
      IMAGE_TAG: ${{ steps.set-image-vars.outputs.IMAGE_TAG }}
      ENVIRONMENT: ${{ steps.set-image-vars.outputs.ENVIRONMENT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Configure Git
        run: |
          git config --global user.email "runner@mail.com"
          git config --global user.name "runner"

      - name: Clone deployment repository
        run: git clone https://11SF:${{ secrets.KUSTOMIZE_REPO_KEY }}@github.com/11SF/3cha-jobs-kustomize.git manifest

      - name: Set deployment variables
        id: deploy-vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=sit" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT
          fi

      - name: Update deployment image
        working-directory: ./manifest/overlays/${{ steps.deploy-vars.outputs.ENVIRONMENT }}
        run: |
          kustomize edit set image registry.nspublic.xyz/3cha/jobs:${{ steps.deploy-vars.outputs.IMAGE_TAG }}
          cat kustomization.yaml

      - name: Commit and push changes
        working-directory: ./manifest
        run: |
          git status
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add .
            git commit -m "Update ${{ steps.deploy-vars.outputs.ENVIRONMENT }} image to ${{ steps.deploy-vars.outputs.IMAGE_TAG }}"
            git push origin main
          fi

      - name: Cleanup
        if: always()
        run: rm -rf manifest
